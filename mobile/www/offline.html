<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>RentEvent</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f7f2e9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#2b2420;padding:24px;box-sizing:border-box;text-align:center;}
    .box{max-width:340px;}
    h1{font-size:1.4rem;margin:0 0 10px;}
    p{margin:0 0 22px;line-height:1.5;color:#6d625b;}
    button{background:#ff5f67;color:#fff;border:0;border-radius:999px;padding:14px 28px;font-size:1rem;font-weight:600;}
  </style>
</head>
<body>
  <div class="box">
    <h1>You're offline</h1>
    <p>RentEvent needs an internet connection. Check your Wi-Fi or data and try again.</p>
    <button type="button" onclick="location.href='https://www.rentevent-app.com/index.html'">Try again</button>
  </div>
</body>
</html>
