<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>You're offline — RentEvent</title>
<style>
  :root{--bg:#f7f2e9;--card:#fff;--text:#161616;--muted:#6a625a;--line:#ece2d3;
        --coral-1:#ff9a73;--coral-3:#ff5f67;--shadow:0 18px 40px rgba(123,96,58,.08)}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
       background:var(--bg);color:var(--text);
       font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;
        box-shadow:var(--shadow);padding:40px 32px;max-width:420px;width:100%;text-align:center}
  .mark{width:72px;height:72px;border-radius:18px;margin:0 auto 20px;display:grid;place-items:center;
        background:linear-gradient(160deg,var(--coral-1),var(--coral-3));
        color:#fff;font-weight:800;font-size:26px;letter-spacing:.5px}
  h1{font-size:22px;margin:0 0 10px}
  p{color:var(--muted);line-height:1.55;margin:0 0 24px;font-size:15px}
  button{border:0;border-radius:999px;padding:13px 28px;font-size:15px;font-weight:600;color:#fff;
         cursor:pointer;background:linear-gradient(135deg,var(--coral-1),var(--coral-3))}
  button:active{transform:translateY(1px)}
</style>
</head>
<body>
  <div class="card">
    <div class="mark">RE</div>
    <h1>You're offline</h1>
    <p>RentEvent needs a connection to load vendors, listings, and messages. Reconnect and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
  <script>
    addEventListener("online", function(){ location.reload(); });
  </script>
</body>
</html>
